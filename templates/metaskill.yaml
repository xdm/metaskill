version: 1
trust:
  allowlist:         # waives the install threshold; also gates auto-update
    - anthropics
    - vercel-labs
  auto_threshold:
    min_installs: 5000
    require_clean_scan: true
  auto_install: false   # true lets a trusted, clean match install without asking
  deny_skills: []    # block one skill from an otherwise trusted publisher
  deny_publishers: []

scan:                # forbidden outside the allowlist
  deny_if_contains:
    - hooks/
    - .mcp.json
    - "curl "
    - "wget "
    - "eval("
    - "process.env"
    - "os.environ"
  max_archive_kb: 2048

log:
  path: ~/.metaskill/log.jsonl
  retention_days: 90
