version: 1
classifier:
  trivial_max_chars: 40   # shorter than this with no domain hit = trivial

trust:
  allowlist:         # auto-install and auto-update
    - anthropics
    - vercel-labs
  auto_threshold:
    min_installs: 5000
    require_clean_scan: true
  deny_skills: []    # block one skill from an otherwise trusted publisher
  deny_publishers: []

scan:                # forbidden outside the allowlist
  deny_if_contains:
    - hooks/
    - .mcp.json
    - "curl "
    - "wget "
    - "eval("
    - "process.env"
    - "os.environ"
  max_archive_kb: 2048

domains: {}          # manual overrides: domain -> skill
                     # e.g. scraping: mycompany/skills@crawler

custom_domains: []   # extend the taxonomy without forking, e.g.
                     # - id: wordpress
                     #   keywords: [wordpress, woocommerce, elementor]
                     #   query: wordpress

log:
  path: ~/.metaskill/log.jsonl
  retention_days: 90
